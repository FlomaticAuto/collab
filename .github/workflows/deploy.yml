name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_BLOG_DB_ID: ${{ secrets.NOTION_BLOG_DB_ID }}
          NOTION_PROJECTS_DB_ID: ${{ secrets.NOTION_PROJECTS_DB_ID }}
          NOTION_DOCS_DB_ID: ${{ secrets.NOTION_DOCS_DB_ID }}
          NOTION_IDEAS_DB_ID: ${{ secrets.NOTION_IDEAS_DB_ID }}

      - name: Inject SPA redirect into 404.html
        run: |
          cat > out/404.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>FlowmaticAuto Collab</title>
            <script>
              var l = window.location;
              var path = l.pathname.replace(/\/$/, '') + '/';
              if (path !== l.pathname) {
                l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + path + l.search + l.hash);
              } else {
                var base = '/collab';
                var p = l.pathname.replace(base, '') || '/';
                l.replace(
                  l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
                  base + '/?p=' + encodeURIComponent(p + l.search) +
                  '&h=' + encodeURIComponent(l.hash || '')
                );
              }
            </script>
          </head>
          <body></body>
          </html>
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
