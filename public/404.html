<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>FlowmaticAuto Collab</title>
  <script>
    // Encode the full path as a query param and redirect to the root.
    // The root page will decode it and restore the URL via history.replaceState.
    var l = window.location;
    var base = '/collab';
    var path = l.pathname.replace(base, '') || '/';
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      base + '/?p=' + encodeURIComponent(path + l.search) + '&h=' + encodeURIComponent(l.hash || '')
    );
  </script>
</head>
<body></body>
</html>
